<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spell It! Digraph Word Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#4D96FF; --pink:#FF6B9D; --purple:#C77DFF;
  --orange:#FF9F43; --teal:#00D2D3; --green:#6BCB77;
  --green-dark:#4da85a; --red:#FF6B6B; --sun:#FFD93D;
  --sh:#e05aa0; --ch:#e07a20; --th:#7048d4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Baloo 2',cursive;
  background:linear-gradient(180deg,#87CEEB 0%,#c8eeff 40%,#d9f7c8 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative;
}
.cloud{position:fixed;background:white;border-radius:50px;opacity:.85;animation:drift linear infinite;pointer-events:none;}
.cloud::before,.cloud::after{content:'';background:white;border-radius:50%;position:absolute;}
.c1{width:120px;height:40px;top:8%;left:-140px;animation-duration:28s;}
.c1::before{width:60px;height:60px;top:-30px;left:15px;}.c1::after{width:40px;height:40px;top:-20px;left:55px;}
.c2{width:90px;height:30px;top:18%;left:-110px;animation-duration:22s;animation-delay:-8s;}
.c2::before{width:45px;height:45px;top:-22px;left:12px;}.c2::after{width:30px;height:30px;top:-15px;left:42px;}
.c3{width:140px;height:45px;top:5%;left:-160px;animation-duration:35s;animation-delay:-15s;}
.c3::before{width:70px;height:70px;top:-35px;left:20px;}.c3::after{width:50px;height:50px;top:-25px;left:65px;}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 200px))}}
.sun{position:fixed;top:20px;right:40px;width:70px;height:70px;background:var(--sun);border-radius:50%;
  box-shadow:0 0 30px #FFD93Daa;animation:sunPulse 3s ease-in-out infinite;pointer-events:none;}
.sun::before{content:'☀️';font-size:60px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
@keyframes sunPulse{0%,100%{box-shadow:0 0 30px #FFD93Daa}50%{box-shadow:0 0 55px #FFD93Dcc}}
.grass{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--green);
  border-radius:40% 40% 0 0/20px 20px 0 0;pointer-events:none;z-index:0;}
.grass::before{content:'';position:absolute;top:-12px;left:0;right:0;height:20px;
  background:var(--green-dark);border-radius:50%;opacity:.4;}
#fw-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}
#drag-ghost{position:fixed;min-width:64px;height:64px;border-radius:14px;display:none;
  align-items:center;justify-content:center;font-family:'Baloo 2',cursive;
  font-size:1.6rem;font-weight:800;color:white;pointer-events:none;z-index:9999;padding:0 10px;
  transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);box-shadow:0 8px 24px rgba(0,0,0,.22);}

/* card */
#game-card{background:white;border-radius:32px;padding:36px 44px 44px;
  box-shadow:0 12px 48px rgba(0,0,0,.14);max-width:580px;width:95%;
  position:relative;z-index:10;text-align:center;}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes tileIn{from{transform:translateY(30px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes correctBounce{0%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes speakPulse{from{transform:scale(1)}to{transform:scale(1.06)}}

/* digraph legend */
#legend{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.legend-pill{display:flex;align-items:center;gap:6px;background:#f4f0ff;border-radius:50px;padding:6px 14px;font-size:.85rem;font-weight:700;color:#555;}
.legend-dot{width:18px;height:18px;border-radius:6px;display:inline-block;}
.legend-dot.sh{background:linear-gradient(135deg,#FF6B9D,#d94f7a);}
.legend-dot.ch{background:linear-gradient(135deg,#FF9F43,#d97c2a);}
.legend-dot.th{background:linear-gradient(135deg,#C77DFF,#9a50d4);}

/* start screen */
#start-screen{text-align:center;padding:8px 0 4px;}
#start-screen .big-emoji{font-size:4.5rem;display:block;margin-bottom:10px;animation:popIn .5s ease both;}
#start-screen h1{font-family:'Baloo 2',cursive;font-size:2.4rem;font-weight:800;color:#2d3a5a;margin-bottom:6px;animation:popIn .5s .1s ease both;}
#start-screen p{font-size:1.05rem;color:#7a8aaa;margin-bottom:20px;line-height:1.5;animation:popIn .5s .2s ease both;}
.digraph-preview{display:flex;justify-content:center;gap:10px;margin:0 auto 24px;animation:popIn .5s .25s ease both;}
.dp-tile{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:800;color:white;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.dp-tile.sh{background:linear-gradient(135deg,#FF6B9D,#d94f7a);}
.dp-tile.ch{background:linear-gradient(135deg,#FF9F43,#d97c2a);}
.dp-tile.th{background:linear-gradient(135deg,#C77DFF,#9a50d4);}
#start-btn{padding:16px 56px;border:none;border-radius:50px;font-family:'Baloo 2',cursive;
  font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;cursor:pointer;box-shadow:0 6px 0 #3a35aa,0 10px 30px rgba(77,100,255,.32);
  transition:transform .1s,box-shadow .1s;animation:popIn .5s .3s ease both;}
#start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a35aa;}

/* game ui */
#progress-wrap{background:#e8f4ff;border-radius:20px;height:14px;margin-bottom:18px;overflow:hidden;}
#progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:20px;transition:width .5s;width:0%;}
#question-count{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#aab8cc;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
#prompt{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;color:#2d3a5a;margin:10px 0 20px;}
#speak-btn{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 28px;
  padding:14px 32px;border:none;border-radius:50px;font-family:'Baloo 2',cursive;
  font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--pink));
  color:white;cursor:pointer;box-shadow:0 5px 0 #b8453a;transition:transform .1s,box-shadow .1s;}
#speak-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8453a;}
#speak-btn.speaking{background:linear-gradient(135deg,var(--purple),var(--blue));
  box-shadow:0 5px 0 #3a35aa;animation:speakPulse .6s ease-in-out infinite alternate;}

/* blanks — variable width for digraph slot */
#blanks-row{display:flex;justify-content:center;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
.blank{min-width:64px;height:72px;border-radius:16px;border:3.5px dashed var(--blue);
  background:#f0f8ff;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;color:var(--blue);
  transition:border-color .2s,background .2s,transform .15s;padding:0 8px;}
.blank.digraph-blank{min-width:82px;}
.blank.drag-over{border-color:var(--purple);background:#f5eeff;transform:scale(1.08);}
.blank.filled{border-style:solid;background:#e8f4ff;cursor:pointer;}
.blank.correct-anim{animation:correctBounce .5s ease;border-color:var(--green);background:#e8fce8;color:var(--green-dark);}
.blank.wrong-anim{animation:shake .5s ease;border-color:var(--red);background:#fff0f0;}

/* tiles */
#letters-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:80px;padding:8px 0;}
.letter-tile{min-width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-size:1.7rem;font-weight:800;color:white;padding:0 10px;
  cursor:grab;user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.18);
  transition:transform .15s,opacity .2s;touch-action:none;animation:tileIn .3s ease both;}
.letter-tile:active{cursor:grabbing;transform:scale(1.12) rotate(-3deg);}
.letter-tile.dragging{opacity:.35;}
.letter-tile.used{opacity:.2;pointer-events:none;}
.letter-tile.digraph{font-size:1.5rem;}

/* feedback + check */
#feedback{font-family:'Nunito',sans-serif;font-size:1.25rem;font-weight:900;min-height:34px;margin-top:18px;}
#feedback.correct{color:var(--green-dark);}
#feedback.wrong{color:var(--red);}
#check-btn{margin-top:18px;padding:13px 44px;border:none;border-radius:50px;
  font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:800;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:white;cursor:pointer;
  box-shadow:0 5px 0 #3a5fc8;transition:transform .1s,box-shadow .1s;}
#check-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a5fc8;}
#check-btn:disabled{opacity:.5;cursor:not-allowed;}

/* score */
#score-screen{display:none;text-align:center;}
#score-screen .trophy{font-size:5rem;margin-bottom:10px;animation:popIn .5s ease;}
#score-screen h2{font-family:'Baloo 2',cursive;font-size:2.5rem;font-weight:800;color:#2d3a5a;margin-bottom:6px;}
.score-val{font-family:'Nunito',sans-serif;font-size:4.5rem;font-weight:900;color:var(--blue);margin:10px 0;animation:popIn .6s .2s ease both;}
#score-screen p{font-size:1.1rem;color:#7a8aaa;margin-bottom:24px;}
.star-row{display:flex;justify-content:center;gap:8px;margin:10px 0 18px;}
.star{font-size:2rem;animation:popIn .4s ease both;}
#play-again-btn{padding:15px 50px;border:none;border-radius:50px;font-family:'Baloo 2',cursive;
  font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--orange),var(--pink));
  color:white;cursor:pointer;box-shadow:0 5px 0 #c95b3a;transition:transform .1s,box-shadow .1s;
  animation:popIn .5s .4s ease both;}
#play-again-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c95b3a;}
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="sun"></div>
<div class="grass"></div>
<canvas id="fw-canvas"></canvas>
<div id="drag-ghost"></div>

<div id="game-card">

  <div id="start-screen">
    <span class="big-emoji">🔤</span>
    <h1>Digraph Spell It!</h1>
    <p>Listen to the word, then drag the tiles<br>to spell it — watch for the special pairs!</p>
    <div class="digraph-preview">
      <div class="dp-tile sh">sh</div>
      <div class="dp-tile ch">ch</div>
      <div class="dp-tile th">th</div>
    </div>
    <button id="start-btn">&#9654; Let's Play!</button>
  </div>

  <div id="game-ui" style="display:none;">
    <div id="question-count">Question 1 of 20</div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="prompt">Listen and spell the word!</div>
    <button id="speak-btn">
      <span style="font-size:1.6rem;line-height:1;">&#128266;</span>&nbsp;Hear the word again
    </button>
    <div id="blanks-row"></div>
    <div id="letters-row"></div>
    <div id="feedback"></div>
    <button id="check-btn" disabled>Check &#10003;</button>
  </div>

  <div id="score-screen">
    <div class="trophy" id="trophy-emoji">&#127942;</div>
    <h2>Great job!</h2>
    <div class="score-val" id="final-score"></div>
    <div class="star-row" id="star-row"></div>
    <p id="score-message"></p>
    <button id="play-again-btn">Play Again &#127881;</button>
  </div>

</div>

<script>
// ── WORD LIST ─────────────────────────────────────────────────────────────
// Each word is stored as an array of "tokens" — either a digraph or a single letter.
// Display form is tokens.join(''), value for checking is same.
var WORD_DATA = [
  // SH words
  { word:'ship',  tokens:['sh','i','p'],  digraph:'sh' },
  { word:'shop',  tokens:['sh','o','p'],  digraph:'sh' },
  { word:'shed',  tokens:['sh','e','d'],  digraph:'sh' },
  { word:'shin',  tokens:['sh','i','n'],  digraph:'sh' },
  { word:'shot',  tokens:['sh','o','t'],  digraph:'sh' },
  { word:'shut',  tokens:['sh','u','t'],  digraph:'sh' },
  { word:'dish',  tokens:['d','i','sh'],  digraph:'sh' },
  { word:'fish',  tokens:['f','i','sh'],  digraph:'sh' },
  { word:'wish',  tokens:['w','i','sh'],  digraph:'sh' },
  { word:'rush',  tokens:['r','u','sh'],  digraph:'sh' },
  { word:'gush',  tokens:['g','u','sh'],  digraph:'sh' },
  { word:'lash',  tokens:['l','a','sh'],  digraph:'sh' },
  { word:'cash',  tokens:['c','a','sh'],  digraph:'sh' },
  { word:'rash',  tokens:['r','a','sh'],  digraph:'sh' },
  { word:'mesh',  tokens:['m','e','sh'],  digraph:'sh' },
  // CH words
  { word:'chin',  tokens:['ch','i','n'],  digraph:'ch' },
  { word:'chip',  tokens:['ch','i','p'],  digraph:'ch' },
  { word:'chop',  tokens:['ch','o','p'],  digraph:'ch' },
  { word:'chat',  tokens:['ch','a','t'],  digraph:'ch' },
  { word:'chess',  tokens:['ch','e','ss'], digraph:'ch' },
  { word:'chest', tokens:['ch','e','st'], digraph:'ch' },
  { word:'rich',  tokens:['r','i','ch'],  digraph:'ch' },
  { word:'such',  tokens:['s','u','ch'],  digraph:'ch' },
  { word:'much',  tokens:['m','u','ch'],  digraph:'ch' },
  { word:'each',  tokens:['e','a','ch'],  digraph:'ch' },
  { word:'inch',  tokens:['i','n','ch'],  digraph:'ch' },
  { word:'bench', tokens:['b','e','n','ch'], digraph:'ch' },
  { word:'lunch', tokens:['l','u','n','ch'], digraph:'ch' },
  { word:'punch', tokens:['p','u','n','ch'], digraph:'ch' },
  // TH words
  { word:'that',  tokens:['th','a','t'],  digraph:'th' },
  { word:'them',  tokens:['th','e','m'],  digraph:'th' },
  { word:'then',  tokens:['th','e','n'],  digraph:'th' },
  { word:'thin',  tokens:['th','i','n'],  digraph:'th' },
  { word:'this',  tokens:['th','i','s'],  digraph:'th' },
  { word:'thud',  tokens:['th','u','d'],  digraph:'th' },
  { word:'bath',  tokens:['b','a','th'],  digraph:'th' },
  { word:'math',  tokens:['m','a','th'],  digraph:'th' },
  { word:'path',  tokens:['p','a','th'],  digraph:'th' },
  { word:'with',  tokens:['w','i','th'],  digraph:'th' },
  { word:'moth',  tokens:['m','o','th'],  digraph:'th' },
  { word:'broth', tokens:['b','r','o','th'], digraph:'th' },
];

// Filter to only 3-token words to keep it manageable (matches 3-blank CVC style)
// We'll allow 3 OR 4 token words but build blanks dynamically
var WORDS = WORD_DATA.filter(function(w){ return w.tokens.length >= 3 && w.tokens.length <= 4; });

var COLORS_SINGLE = [
  'linear-gradient(135deg,#4D96FF,#3a72cc)',
  'linear-gradient(135deg,#00D2D3,#009a9b)',
  'linear-gradient(135deg,#6BCB77,#4aa855)',
  'linear-gradient(135deg,#FF6B6B,#cc4444)',
  'linear-gradient(135deg,#FFD93D,#d4a800)',
];
var COLOR_SH = 'linear-gradient(135deg,#FF6B9D,#d94f7a)';
var COLOR_CH = 'linear-gradient(135deg,#FF9F43,#d97c2a)';
var COLOR_TH = 'linear-gradient(135deg,#C77DFF,#9a50d4)';

function digraphColor(token) {
  if (token === 'sh') return COLOR_SH;
  if (token === 'ch') return COLOR_CH;
  if (token === 'th') return COLOR_TH;
  return null;
}

var DISTRACTOR_SINGLES = 'aeiouбcdfghjklmnprstw'.split('').filter(function(c){
  return 'abcdefghijklmnoprstuw'.indexOf(c) >= 0;
});
var DISTRACTOR_DIGRAPHS = ['sh','ch','th'];

var TOTAL = 20;
var usedWords = [], currentEntry = null, currentQ = 0, score = 0;
var blankValues = [];
var dragData = null;
var audioCtx = null;
var numBlanks = 0;

var startScreen = document.getElementById('start-screen');
var gameUI      = document.getElementById('game-ui');
var scoreScreen = document.getElementById('score-screen');
var promptEl    = document.getElementById('prompt');
var feedbackEl  = document.getElementById('feedback');
var checkBtn    = document.getElementById('check-btn');
var progressBar = document.getElementById('progress-bar');
var qCount      = document.getElementById('question-count');
var lettersRow  = document.getElementById('letters-row');
var blanksRow   = document.getElementById('blanks-row');
var dragGhost   = document.getElementById('drag-ghost');

// ── UTILS ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickWord() {
  var pool = WORDS.filter(function(w){ return usedWords.indexOf(w.word) === -1; });
  if (!pool.length) { usedWords = []; pool = WORDS; }
  var w = pool[Math.floor(Math.random()*pool.length)];
  usedWords.push(w.word);
  return w;
}

function getDistractors(entry) {
  var usedTokens = entry.tokens.slice();
  var usedSingles = [];
  var hasDigraph = false;
  usedTokens.forEach(function(t){
    if (t.length === 1) usedSingles.push(t);
    else hasDigraph = true;
  });

  var result = [];

  // Add 1–2 single-letter distractors
  var singlePool = shuffle('aeioucdfghjklmnprstw'.split('').filter(function(c){
    return usedSingles.indexOf(c) === -1;
  }));
  result.push(singlePool[0]);
  result.push(singlePool[1]);

  // Optionally add a wrong digraph distractor
  var wrongDigraphs = DISTRACTOR_DIGRAPHS.filter(function(d){
    return usedTokens.indexOf(d) === -1;
  });
  if (wrongDigraphs.length > 0) {
    result.push(wrongDigraphs[Math.floor(Math.random()*wrongDigraphs.length)]);
  }

  return result;
}

// ── AUDIO ─────────────────────────────────────────────────────────────────
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function unlockAudio() {
  try { var ac=getACtx(),buf=ac.createBuffer(1,1,22050),src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(0); } catch(e){}
}
function playBells() {
  try {
    var ac = getACtx();
    var freqs = [523.25,659.25,783.99,1046.50];
    for (var i=0;i<freqs.length;i++){
      (function(freq,idx){
        var t=ac.currentTime+idx*0.18;
        var o1=ac.createOscillator(),g1=ac.createGain();
        o1.type='sine';o1.frequency.setValueAtTime(freq,t);
        g1.gain.setValueAtTime(.45,t);g1.gain.exponentialRampToValueAtTime(.001,t+1.1);
        o1.connect(g1);g1.connect(ac.destination);o1.start(t);o1.stop(t+1.1);
        var o2=ac.createOscillator(),g2=ac.createGain();
        o2.type='triangle';o2.frequency.setValueAtTime(freq*2.756,t);
        g2.gain.setValueAtTime(.18,t);g2.gain.exponentialRampToValueAtTime(.001,t+.6);
        o2.connect(g2);g2.connect(ac.destination);o2.start(t);o2.stop(t+.6);
      })(freqs[i],i);
    }
  } catch(e){}
}

// ── TTS ───────────────────────────────────────────────────────────────────
function speakWord(word) {
  var w = word || (currentEntry && currentEntry.word);
  if (!w) return;
  window.speechSynthesis.cancel();
  var btn = document.getElementById('speak-btn');
  if (btn) btn.classList.add('speaking');
  var utter = new SpeechSynthesisUtterance('Spell... ' + w);
  utter.rate=0.82; utter.pitch=1.1; utter.volume=1;
  utter.onend=function(){ if(btn) btn.classList.remove('speaking'); };
  utter.onerror=function(){ if(btn) btn.classList.remove('speaking'); };
  function go() {
    var voices=window.speechSynthesis.getVoices(), pick=null;
    for(var i=0;i<voices.length;i++){
      if(/samantha|karen|moira|susan|google us|zira/i.test(voices[i].name)){pick=voices[i];break;}
    }
    if(!pick){ for(var i=0;i<voices.length;i++){ if(voices[i].lang&&voices[i].lang.indexOf('en')===0){pick=voices[i];break;} } }
    if(pick) utter.voice=pick;
    window.speechSynthesis.speak(utter);
  }
  if(window.speechSynthesis.getVoices().length>0) go();
  else window.speechSynthesis.onvoiceschanged=function(){ go(); };
}

// ── FIREWORKS ─────────────────────────────────────────────────────────────
var fwCanvas=document.getElementById('fw-canvas');
var fwCtx=fwCanvas.getContext('2d');
var fwParts=[],fwFrame=null;
function resizeFW(){ fwCanvas.width=window.innerWidth; fwCanvas.height=window.innerHeight; }
window.addEventListener('resize',resizeFW); resizeFW();
function fwBurst(x,y){
  var colors=['#FFD93D','#FF6B9D','#4D96FF','#C77DFF','#FF9F43','#6BCB77','#FF6B6B','#00D2D3'];
  for(var i=0;i<52;i++){
    var angle=(Math.PI*2/52)*i+Math.random()*.12, speed=Math.random()*6+2.5;
    fwParts.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,
      color:colors[Math.floor(Math.random()*colors.length)],life:1,size:Math.random()*8+3,grav:.13});
  }
}
function fwLoop(){
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  for(var i=fwParts.length-1;i>=0;i--){
    var p=fwParts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.life-=.02;
    if(p.life<=0){fwParts.splice(i,1);continue;}
    fwCtx.globalAlpha=Math.max(0,p.life);fwCtx.fillStyle=p.color;
    fwCtx.beginPath();fwCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);fwCtx.fill();
  }
  fwCtx.globalAlpha=1;
  if(fwParts.length>0) fwFrame=requestAnimationFrame(fwLoop);
  else{ fwFrame=null; fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height); }
}
function launchFireworks(big){
  var count=big?8:5, gap=big?220:160;
  if(fwFrame){cancelAnimationFrame(fwFrame);fwFrame=null;}
  for(var f=0;f<count;f++){
    (function(idx){setTimeout(function(){
      fwBurst(fwCanvas.width*.15+Math.random()*fwCanvas.width*.70,
              fwCanvas.height*.10+Math.random()*fwCanvas.height*.45);
      if(!fwFrame) fwFrame=requestAnimationFrame(fwLoop);
    },idx*gap+10);})(f);
  }
}

// ── GAME LOGIC ────────────────────────────────────────────────────────────
function buildBlanks(entry) {
  blanksRow.innerHTML = '';
  blankValues = [];
  numBlanks = entry.tokens.length;
  for (var i = 0; i < numBlanks; i++) {
    blankValues.push('');
    var b = document.createElement('div');
    b.className = 'blank' + (entry.tokens[i].length > 1 ? ' digraph-blank' : '');
    b.id = 'blank-' + i;
    b.dataset.index = i;
    blanksRow.appendChild(b);

    // click-to-remove
    (function(idx){
      b.addEventListener('click', function(){
        if(this.dataset.tileKey){ clearBlank(idx); updateCheck(); }
      });
    })(i);
  }
}

function startQuestion() {
  currentEntry  = pickWord();
  feedbackEl.textContent = '';
  feedbackEl.className   = '';

  qCount.textContent      = 'Question ' + (currentQ+1) + ' of ' + TOTAL;
  progressBar.style.width = ((currentQ / TOTAL) * 100) + '%';

  buildBlanks(currentEntry);

  // build tile pool: tokens of word + distractors
  var dist   = getDistractors(currentEntry);
  var tokens = shuffle(currentEntry.tokens.slice().concat(dist));

  lettersRow.innerHTML = '';
  var colorIdx = 0;
  for (var i = 0; i < tokens.length; i++) {
    (function(token, idx){
      var key  = token + '_' + idx;
      var tile = document.createElement('div');
      var isDigraph = token.length > 1;
      tile.className        = 'letter-tile' + (isDigraph ? ' digraph' : '');
      tile.textContent      = token;
      tile.dataset.letter   = token;
      tile.dataset.key      = key;
      tile.dataset.isDigraph = isDigraph ? '1' : '0';
      var dc = digraphColor(token);
      tile.style.background = dc ? dc : COLORS_SINGLE[colorIdx % COLORS_SINGLE.length];
      if (!dc) colorIdx++;
      tile.style.animationDelay = (idx * 0.06) + 's';
      attachTile(tile);
      lettersRow.appendChild(tile);
    })(tokens[i], i);
  }

  checkBtn.disabled = true;
  setTimeout(function(){ speakWord(currentEntry.word); }, 420);
}

function updateCheck() {
  var filled = blankValues.filter(function(v){ return v !== ''; }).length;
  checkBtn.disabled = (filled < numBlanks);
}

function clearBlank(idx) {
  var b = document.getElementById('blank-'+idx);
  if (!b || !b.dataset.tileKey) return;
  var tile = document.querySelector('.letter-tile[data-key="'+b.dataset.tileKey+'"]');
  if (tile) tile.classList.remove('used');
  b.textContent     = '';
  b.dataset.tileKey = '';
  b.classList.remove('filled');
  blankValues[idx]  = '';
}

function dropOnBlank(tile, toIdx, fromIdx) {
  var toB = document.getElementById('blank-'+toIdx);
  if (!toB) return;

  if (toB.dataset.tileKey && toB.dataset.tileKey !== tile.dataset.key) {
    var exTile = document.querySelector('.letter-tile[data-key="'+toB.dataset.tileKey+'"]');
    if (fromIdx !== null && fromIdx !== undefined) {
      var fromB = document.getElementById('blank-'+fromIdx);
      if (fromB) {
        fromB.textContent     = exTile ? exTile.dataset.letter : '';
        fromB.dataset.tileKey = toB.dataset.tileKey;
        fromB.classList.add('filled');
        blankValues[fromIdx]  = blankValues[toIdx];
        if (exTile) exTile.classList.add('used');
      }
    } else {
      if (exTile) exTile.classList.remove('used');
    }
    blankValues[toIdx]  = '';
    toB.dataset.tileKey = '';
  }

  if (fromIdx !== null && fromIdx !== undefined) {
    var fb = document.getElementById('blank-'+fromIdx);
    if (fb && fb.dataset.tileKey === tile.dataset.key) {
      fb.textContent     = '';
      fb.dataset.tileKey = '';
      fb.classList.remove('filled');
      blankValues[fromIdx] = '';
    }
  }

  toB.textContent     = tile.dataset.letter;
  toB.dataset.tileKey = tile.dataset.key;
  toB.classList.add('filled');
  blankValues[toIdx]  = tile.dataset.letter;
  tile.classList.add('used');
}

// ── DRAG & TAP ────────────────────────────────────────────────────────────
function attachTile(tile) {
  tile.addEventListener('mousedown',  tileMouseDown);
  tile.addEventListener('touchstart', tileTouchStart, {passive:false});
  tile.addEventListener('click',      tileTap);
}

function tileMouseDown(e) {
  if (e.button !== 0) return;
  var tile = e.currentTarget;
  if (tile.classList.contains('used')) return;
  e.preventDefault();
  beginDrag(tile, e.clientX, e.clientY);
  document.addEventListener('mousemove', onMM);
  document.addEventListener('mouseup',   onMU);
}

function tileTouchStart(e) {
  var tile = e.currentTarget;
  if (tile.classList.contains('used')) return;
  e.preventDefault();
  beginDrag(tile, e.touches[0].clientX, e.touches[0].clientY);
  document.addEventListener('touchmove', onTM, {passive:false});
  document.addEventListener('touchend',  onTE);
}

function beginDrag(tile, x, y) {
  var fromBlank = null;
  for (var i = 0; i < numBlanks; i++) {
    var b = document.getElementById('blank-'+i);
    if (b && b.dataset.tileKey === tile.dataset.key) fromBlank = i;
  }
  dragData = {tile:tile, fromBlank:fromBlank};
  tile.classList.add('dragging');
  dragGhost.textContent      = tile.dataset.letter;
  dragGhost.style.background = tile.style.background;
  dragGhost.style.display    = 'flex';
  moveGhost(x, y);
}

function moveGhost(x, y) {
  dragGhost.style.left = x + 'px';
  dragGhost.style.top  = y + 'px';
  var blanks = document.querySelectorAll('.blank');
  for (var i=0;i<blanks.length;i++) blanks[i].classList.remove('drag-over');
  var el = document.elementFromPoint(x, y);
  var bl = el && el.closest ? el.closest('.blank') : null;
  if (bl) bl.classList.add('drag-over');
}

function endDrag(x, y) {
  if (!dragData) return;
  dragGhost.style.display = 'none';
  var blanks = document.querySelectorAll('.blank');
  for (var i=0;i<blanks.length;i++) blanks[i].classList.remove('drag-over');
  var tile = dragData.tile;
  tile.classList.remove('dragging');
  var el = document.elementFromPoint(x, y);
  var bl = el && el.closest ? el.closest('.blank') : null;
  if (bl) {
    dropOnBlank(tile, parseInt(bl.dataset.index), dragData.fromBlank);
  } else if (dragData.fromBlank !== null) {
    clearBlank(dragData.fromBlank);
  }
  dragData = null;
  updateCheck();
}

function onMM(e){ moveGhost(e.clientX, e.clientY); }
function onMU(e){ endDrag(e.clientX, e.clientY); document.removeEventListener('mousemove',onMM); document.removeEventListener('mouseup',onMU); }
function onTM(e){ e.preventDefault(); moveGhost(e.touches[0].clientX, e.touches[0].clientY); }
function onTE(e){ endDrag(e.changedTouches[0].clientX, e.changedTouches[0].clientY); document.removeEventListener('touchmove',onTM); document.removeEventListener('touchend',onTE); }

function tileTap(e) {
  if (dragData) return;
  var tile = e.currentTarget;
  if (tile.classList.contains('used')) return;
  for (var i = 0; i < numBlanks; i++) {
    var b = document.getElementById('blank-'+i);
    if (b && !b.dataset.tileKey) {
      dropOnBlank(tile, i, null);
      updateCheck();
      return;
    }
  }
}

// ── CHECK ─────────────────────────────────────────────────────────────────
checkBtn.addEventListener('click', function() {
  var answer = blankValues.join('');
  var correct = currentEntry.tokens.join('');
  if (answer === correct) {
    score++;
    feedbackEl.textContent = '🌟 Awesome! You spelled it!';
    feedbackEl.className   = 'correct';
    var blanks = document.querySelectorAll('.blank');
    for (var i=0;i<blanks.length;i++) blanks[i].classList.add('correct-anim');
    checkBtn.disabled = true;
    playBells();
    setTimeout(function(){ launchFireworks(false); }, 60);
    setTimeout(function(){
      currentQ++;
      if (currentQ >= TOTAL) showScore();
      else startQuestion();
    }, 2300);
  } else {
    feedbackEl.textContent = '🙈 Try again!';
    feedbackEl.className   = 'wrong';
    var blanks = document.querySelectorAll('.blank');
    for (var i=0;i<blanks.length;i++) blanks[i].classList.add('wrong-anim');
    setTimeout(function(){
      var bl2 = document.querySelectorAll('.blank');
      for (var i=0;i<bl2.length;i++) bl2[i].classList.remove('wrong-anim');
    }, 600);
    setTimeout(function(){
      for (var i=0;i<numBlanks;i++) clearBlank(i);
      updateCheck();
      feedbackEl.textContent = 'Try again! ✏️';
    }, 700);
  }
});

// ── SCORE ─────────────────────────────────────────────────────────────────
function showScore() {
  gameUI.style.display      = 'none';
  scoreScreen.style.display = 'block';
  progressBar.style.width   = '100%';
  document.getElementById('final-score').textContent = score + ' / ' + TOTAL;
  var pct = score / TOTAL;
  var trophy='🏆', msg='';
  if (pct===1)        { trophy='🌟'; msg='Perfect score! Digraph superstar!'; }
  else if (pct>=0.8)  { trophy='🏆'; msg="Excellent! You're a great speller!"; }
  else if (pct>=0.6)  { trophy='😊'; msg='Good job! Keep practicing!'; }
  else                 { trophy='💪'; msg='Nice try! Practice makes perfect!'; }
  document.getElementById('trophy-emoji').textContent  = trophy;
  document.getElementById('score-message').textContent = msg;
  var starRow = document.getElementById('star-row');
  starRow.innerHTML = '';
  var stars = pct===1 ? 3 : pct>=0.7 ? 2 : 1;
  for (var i=0;i<3;i++){
    var s = document.createElement('span');
    s.className = 'star';
    s.textContent = i < stars ? '⭐' : '☆';
    s.style.animationDelay = (0.3+i*0.15)+'s';
    s.style.opacity = i < stars ? '1' : '0.3';
    starRow.appendChild(s);
  }
  if (pct===1){ playBells(); setTimeout(function(){ launchFireworks(true); }, 80); }
}

document.getElementById('play-again-btn').addEventListener('click', function(){
  usedWords=[]; currentQ=0; score=0;
  scoreScreen.style.display = 'none';
  gameUI.style.display      = 'block';
  progressBar.style.width   = '0%';
  startQuestion();
});

document.getElementById('speak-btn').addEventListener('click', function(){ speakWord(); });

document.getElementById('start-btn').addEventListener('click', function(){
  unlockAudio();
  startScreen.style.display = 'none';
  gameUI.style.display      = 'block';
  startQuestion();
});
</script>
